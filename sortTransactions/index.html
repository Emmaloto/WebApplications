<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Transaction Classifier</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>

<section class="section">
  <div class="container">
    <h2 class="title">Transaction Classifier</h2>

    <div class="columns">
      <div class="column">
        <label class="label">Upload Category Mapping CSV</label>
        <input type="file" id="mappingFile" class="file-input" accept=".csv">
      </div>
    </div>

    <div class="columns">
      <div class="column">
        <label class="label">Upload Transactions CSV</label>
        <input type="file" id="transactionsFile" class="file-input" accept=".csv">
      </div>

      <div class="column">
        <label class="label">Column Number containing description/name:</label>
        <input type="number" id="columnNumber" class="input" min="1" value="2">
      </div>

      <div class="column">
        <label class="label">Has Headers:</label>
        <input type="checkbox" id="hasHeaders" class="checkbox" checked>
      </div>
    </div>

    <div class="columns">
      <div class="column">
        <button class="button is-primary" onclick="processFiles()">Classify</button>
      </div>
    </div>

    <div class="columns">
      <div class="column">
        <div id="result" class="content"></div>
      </div>

      <div class="column">
        <div id="todo" class="content"></div>
      </div>
    </div>
  </div>
</section>

<script src="js/app.js"></script>
<script src="js/styles.js"></script>
</body>
</html>
